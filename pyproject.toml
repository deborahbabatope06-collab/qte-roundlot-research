[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qte-roundlot-research"
version = "0.1.0"
description = "Reconstructs a QTE market-making desk's per-second quoting presence and measures time lost to undersized quotes (round-lot rule 4002)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
fetch = ["qte-sdk @ git+https://github.com/josh-g-s/qte-sdk"]
dev = ["pytest>=8"]

[project.scripts]
roundlot = "roundlot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
